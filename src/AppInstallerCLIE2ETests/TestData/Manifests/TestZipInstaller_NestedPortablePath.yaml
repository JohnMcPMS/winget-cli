# yaml-language-server: $schema=https://aka.ms/winget-manifest.singleton.1.4.0.schema.json

PackageIdentifier: AppInstallerTest.NestedPortableAliasesPath
PackageVersion: 1.0.0.0
PackageName: NestedPortableAliasesPath
PackageLocale: en-US
Publisher: AppInstallerTest
License: Test
ShortDescription: Nested portable alias regression fixture.
Installers:
  - Architecture: x64
