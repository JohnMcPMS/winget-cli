      - RelativeFilePath: nested\bin\AppInstallerTestExeInstaller.exe
        PortableCommandAlias: PortableNestedOne
      - RelativeFilePath: .\nested\bin\AppInstallerTestExeInstaller.exe
        PortableCommandAlias: PortableNestedTwo
ManifestType: singleton
ManifestVersion: 1.4.0
